services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_hrms
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_secure_enterprise_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_hrms"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nexus-hrms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-hrms-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://nexus:nexus_secure_enterprise_password_2026@postgres:5432/nexus_hrms
      JWT_SECRET: nexus-enterprise-production-super-secret-key-32chars
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
