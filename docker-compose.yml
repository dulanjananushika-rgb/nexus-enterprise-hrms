services:
  nexus-hrms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-hrms-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=nexus-enterprise-production-super-secret-key-32chars
      - DATA_DIR=/app/server/data
    volumes:
      - ./server/data:/app/server/data
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
